<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Control de Actividades</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    .container { max-width: 600px; margin: auto; }
    button { padding: 10px 15px; margin: 5px 0; width: 100%; font-size: 16px; }
    input, select, textarea { width: 100%; padding: 10px; margin-top: 10px; }
    .history { margin-top: 30px; }
  </style>
</head>
<body>
<div class="container">
  <h2>Registro de Actividades</h2>

  <label>ID del Operario:</label>
  <input type="text" id="operarioId" value="252" />

  <label>Nombre del Operario:</label>
  <input type="text" id="operarioNombre" value="José Pérez" />

  <label>Selecciona actividad:</label>
  <select id="activityType">
    <option value="produccion">Producción</option>
    <option value="corte">Corte</option>
    <option value="limpieza">Limpieza</option>
    <option value="pausa">Pausa</option>
  </select>

  <textarea id="startComment" placeholder="Comentario de inicio..."></textarea>
  <button id="startBtn">Iniciar Actividad</button>

  <textarea id="endComment" placeholder="Comentario de fin..."></textarea>
  <button id="stopBtn">Finalizar Actividad</button>

  <div class="history">
    <h3>Historial en tiempo real</h3>
    <ul id="historyList"></ul>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getFirestore, collection, addDoc, Timestamp, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // === FIREBASE CONFIG ORIGINAL — TAL CUAL VENÍA EN TU HTML ===
    const FIREBASE_CONFIG = {
      apiKey: "AIzaSyAvXoCjalqf0B-Flr706lPPwbFguGi5OTs",
      authDomain: "aguilarproductividad-1bcd6.firebaseapp.com",
      projectId: "aguilarproductividad-1bcd6",
      storageBucket: "aguilarproductividad-1bcd6.appspot.com",
      messagingSenderId: "995069538159",
      appId: "1:995069538159:web:1eb97bfd5d08b77fa9c29a"
    };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // --- BOTÓN INICIO ---
  document.getElementById("startBtn").onclick = async () => {
    const operarioId = document.getElementById("operarioId").value;
    const operarioNombre = document.getElementById("operarioNombre").value;
    const activityType = document.getElementById("activityType").value;
    const startComment = document.getElementById("startComment").value;

    if (!operarioId || !operarioNombre) {
      alert("Debes introducir ID y nombre del operario");
      return;
    }

    await addDoc(collection(db, "actividades"), {
      operarioId,
      operarioNombre,
      activityType,
      startTime: Timestamp.now(),
      startComment,
      timestamp_created: Timestamp.now()
    });

    alert("Actividad iniciada");
  };

  // --- BOTÓN FIN ---
  document.getElementById("stopBtn").onclick = async () => {
    const operarioId = document.getElementById("operarioId").value;
    const operarioNombre = document.getElementById("operarioNombre").value;
    const endComment = document.getElementById("endComment").value;
    const activityType = document.getElementById("activityType").value;

    await addDoc(collection(db, "actividades"), {
      operarioId,
      operarioNombre,
      activityType,
      endTime: Timestamp.now(),
      endComment,
      timestamp_created: Timestamp.now()
    });

    alert("Actividad finalizada");
  };

  // --- HISTORIAL EN TIEMPO REAL ---
  function initRealtime() {
    const q = query(collection(db, "actividades"), orderBy("timestamp_created", "desc"));

    onSnapshot(q, (snapshot) => {
      const list = document.getElementById("historyList");
      list.innerHTML = "";

      snapshot.forEach((doc) => {
        const d = doc.data();
        const li = document.createElement("li");
        li.innerHTML = `
          <strong>${d.activityType}</strong><br>
          Operario: ${d.operarioNombre} (${d.operarioId})<br>
          Inicio: ${d.startTime ? d.startTime.toDate().toLocaleString() : "-"}<br>
          Fin: ${d.endTime ? d.endTime.toDate().toLocaleString() : "-"}<br>
          Inicio comentario: ${d.startComment || "-"}<br>
          Fin comentario: ${d.endComment || "-"}
        `;
        list.appendChild(li);
      });
    });
  }

  initRealtime();
</script>

</body>
</html>
